{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-12">
    <div class="flex items-center gap-4 mb-8">
        <a href="{{ url_for('admin_dashboard') }}" class="text-gray-500 hover:text-dark">← Retour</a>
        <h1 class="text-3xl font-bold font-serif">Ajouter un Établissement</h1>
    </div>

    <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
        <form method="POST" action="{{ url_for('admin_add_hotel') }}" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Nom de l'établissement *</label>
                    <input type="text" name="name" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-faso focus:ring-2 focus:ring-green-100 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Type *</label>
                    <select name="type" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-faso focus:ring-2 focus:ring-green-100 outline-none transition">
                        <option value="hotel">Hôtel</option>
                        <option value="auberge">Auberge</option>
                        <option value="residence">Résidence</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Ville *</label>
                    <input type="text" name="city" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-faso focus:ring-2 focus:ring-green-100 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Adresse / Quartier</label>
                    <input type="text" name="address" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-faso focus:ring-2 focus:ring-green-100 outline-none transition">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Étoiles</label>
                    <input type="number" name="stars" min="0" max="5" value="0" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-faso focus:ring-2 focus:ring-green-100 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Prix de base (FCFA) *</label>
                    <input type="number" name="price_base" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-faso focus:ring-2 focus:ring-green-100 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Image (URL)</label>
                    <input type="url" name="image_url" placeholder="https://..." class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-faso focus:ring-2 focus:ring-green-100 outline-none transition">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">WhatsApp</label>
                    <input type="text" name="whatsapp" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-faso focus:ring-2 focus:ring-green-100 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Téléphone</label>
                    <input type="text" name="phone" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-faso focus:ring-2 focus:ring-green-100 outline-none transition">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Email</label>
                <input type="email" name="email" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-faso focus:ring-2 focus:ring-green-100 outline-none transition">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Commodités (séparées par des virgules)</label>
                <input type="text" name="amenities" placeholder="WiFi, Piscine, Parking..." class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-faso focus:ring-2 focus:ring-green-100 outline-none transition">
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full bg-faso text-white px-6 py-4 rounded-xl font-bold shadow-lg hover:bg-green-700 transition text-lg">
                    Enregistrer l'établissement
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
