<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nos Hôtels & Auberges - GAANSAOBA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .page-header {
      padding: 150px 0 60px;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?q=80&w=1600') center/cover;
      color: white;
      text-align: center;
    }
    .filters-bar {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: var(--shadow);
      margin-top: -40px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      position: relative;
      z-index: 10;
    }
    .filter-item select {
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid #ddd;
      outline: none;
    }
    .listing-container {
      padding: 60px 0;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header scrolled" id="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon">🏨</span>
        <span class="logo-text">GAANSAOBA</span>
      </a>
      <nav class="nav" id="nav">
        <a href="index.html" class="nav-link">Accueil</a>
        <a href="hotels.html" class="nav-link active">Hôtels</a>
        <a href="auberges.html" class="nav-link">Auberges</a>
        <a href="reservations.html" class="nav-link">Réservations</a>
        <a href="promotions.html" class="nav-link">Promotions</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>
      <div class="header-actions">
        <a href="connexion.html" class="btn-outline">Connexion</a>
        <a href="#" class="btn-primary">Réserver</a>
      </div>
    </div>
  </header>

  <section class="page-header">
    <div class="container">
      <h1 class="hero-title">Découvrez nos établissements</h1>
      <p>Le meilleur de l'hôtellerie au Burkina Faso, trié pour vous.</p>
    </div>
  </section>

  <div class="container">
    <div class="filters-bar">
      <div class="filter-item">
        <label>Ville: </label>
        <select id="filterCity">
          <option value="all">Toutes les villes</option>
          <option value="ouaga">Ouagadougou</option>
          <option value="bobo">Bobo-Dioulasso</option>
          <option value="ouahi">Ouahigouya</option>
        </select>
      </div>
      <div class="filter-item">
        <label>Type: </label>
        <select id="filterType">
          <option value="all">Tous les types</option>
          <option value="hotel">Hôtels</option>
          <option value="auberge">Auberges</option>
          <option value="residence">Résidences</option>
        </select>
      </div>
      <div class="filter-item">
        <label>Prix: </label>
        <select id="filterPrice">
          <option value="all">Tous les prix</option>
          <option value="low">Moins de 15 000 F</option>
          <option value="mid">15 000 F - 40 000 F</option>
          <option value="high">Plus de 40 000 F</option>
        </select>
      </div>
    </div>
  </div>

  <section class="listing-container">
    <div class="container">
      <div class="hotels-grid" id="fullHotelsGrid">
        <!-- Injected by JS -->
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 GAANSAOBA - Tous droits réservés</p>
        <div class="footer-flags">🇧🇫 Made in Burkina Faso</div>
      </div>
    </div>
  </footer>

  <!-- MODALS (Copy from index or include via JS) -->
  <div class="modal-overlay" id="reservationModal">
    <div class="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <h2>🏨 Réservation Rapide</h2>
      <div id="modalHotelName" class="modal-hotel-name" style="font-weight: 800; color: var(--primary); margin-bottom: 20px;"></div>
      <form id="reservationForm">
        <div class="form-group">
          <label>Prénom & Nom</label>
          <input type="text" id="guestName" required />
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">Confirmer</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="successModal">
    <div class="modal" style="text-align: center;">
      <div style="font-size: 3rem; margin-bottom: 20px;">✅</div>
      <h2>Merci !</h2>
      <p id="successMessage"></p>
      <button class="btn-primary" onclick="location.reload()">Fermer</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('fullHotelsGrid');
      const cityFilter = document.getElementById('filterCity');
      const typeFilter = document.getElementById('filterType');
      const priceFilter = document.getElementById('filterPrice');

      function render(data) {
        grid.innerHTML = '';
        data.forEach(hotel => {
          const card = document.createElement('div');
          card.className = 'hotel-card';
          card.innerHTML = `
            <div class="hotel-img-wrapper">
              <img src="${hotel.image}" alt="${hotel.name}">
              <div class="hotel-tag">${hotel.tag}</div>
            </div>
            <div class="hotel-info">
              <div class="hotel-stars">${'⭐'.repeat(hotel.stars)}</div>
              <h3 class="hotel-name">${hotel.name}</h3>
              <p class="hotel-location">📍 ${hotel.location}</p>
              <div class="hotel-footer">
                <div class="hotel-price">${hotel.price.toLocaleString()} F CFA <span>/ nuit</span></div>
                <button class="btn-primary" onclick="openReservationModal(${hotel.id})">Réserver</button>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      function filter() {
        let filtered = hotelsData;
        if (cityFilter.value !== 'all') filtered = filtered.filter(h => h.city === cityFilter.value);
        if (typeFilter.value !== 'all') filtered = filtered.filter(h => h.type === typeFilter.value);
        if (priceFilter.value === 'low') filtered = filtered.filter(h => h.price < 15000);
        if (priceFilter.value === 'mid') filtered = filtered.filter(h => h.price >= 15000 && h.price <= 40000);
        if (priceFilter.value === 'high') filtered = filtered.filter(h => h.price > 40000);
        render(filtered);
      }

      cityFilter.addEventListener('change', filter);
      typeFilter.addEventListener('change', filter);
      priceFilter.addEventListener('change', filter);

      render(hotelsData);

      window.openReservationModal = (id) => {
        const h = hotelsData.find(x => x.id === id);
        document.getElementById('modalHotelName').innerText = h.name;
        document.getElementById('reservationModal').style.display = 'flex';
      };

      document.getElementById('modalClose').onclick = () => document.getElementById('reservationModal').style.display = 'none';
      document.getElementById('reservationForm').onsubmit = (e) => {
        e.preventDefault();
        document.getElementById('reservationModal').style.display = 'none';
        document.getElementById('successMessage').innerText = "Réservation enregistrée !";
        document.getElementById('successModal').style.display = 'flex';
      };
    });
  </script>
</body>
</html>
